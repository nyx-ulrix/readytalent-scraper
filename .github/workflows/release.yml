# Builds AutoResume for Windows and macOS (Apple Silicon + Intel) and publishes them as one GitHub release.
# Trigger: push a tag like v1.0.0. macOS apps can only be built on macOS, hence the matrix.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: macos-latest
            dist: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Self-checks and type-check
        run: |
          pnpm test
          pnpm exec tsc --noEmit -p .
      - name: Build installers
        run: pnpm run ${{ matrix.dist }}
      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        run: |
          for app in release/mac*/AutoResume.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "Identifier|Signature|Format"
          done
      - name: Check every installer was built
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then want="mac-arm64.dmg mac-x64.dmg mac-arm64.zip mac-x64.zip"; else want="win-x64.exe"; fi
          for w in $want; do ls release/*"$w" || { echo "missing $w"; exit 1; }; done
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AutoResume $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
